# Builds Gachashift.exe on GitHub's Windows machines and publishes it as a Release
# whenever a version tag such as v1.0.1 is pushed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed to create the Release and upload the zip

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.16"

      - name: Check tag matches version
        shell: python
        run: |
          # Read __version__ as text instead of importing the package:
          # this script runs from a temp dir, so the repo is not on sys.path.
          import os, re, pathlib
          text = pathlib.Path("gachashift/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', text)
          if not match:
              raise SystemExit("Could not find __version__ in gachashift/__init__.py")
          version = match.group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != "v" + version:
              raise SystemExit(f"Tag {tag} doesn't match __version__ {version}; "
                               "update gachashift/__init__.py first.")
          print(f"Tag {tag} matches __version__ {version}")

      - name: Build
        run: python build.py

      - name: Publish the Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Gachashift-*.zip
          generate_release_notes: true
